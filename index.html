<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Haven - Online Food Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="header">
       
    </header>
    <main>
        <section class="hero">
            <h1>Welcome to Foodie Haven</h1>
            <p>Delicious food delivered to your doorstep</p>
            <a href="menu.html" class="cta-button">Order Now</a>
        </section>
        <section class="featured-products">
            <h2>Featured Dishes</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x200?text=Featured+Dish+1" alt="Featured Dish 1">
                    <h3>Special Pasta</h3>
                    <p>Our chef's special pasta dish</p>
                    <span class="price">$19.99</span>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x200?text=Featured+Dish+2" alt="Featured Dish 2">
                    <h3>Gourmet Burger</h3>
                    <p>Premium ingredients in every bite</p>
                    <span class="price">$15.99</span>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x200?text=Featured+Dish+3" alt="Featured Dish 3">
                    <h3>Fresh Salad</h3>
                    <p>Healthy and refreshing option</p>
                    <span class="price">$12.99</span>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
