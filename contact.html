<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlinkBite - Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header></header>
    <main>
        <section class="hero contact-hero">
            <h1>Contact BlinkBite</h1>
            <p>Need help with an order or want to work with us? We’re available 24/7.</p>
        </section>
        <section class="contact-content">
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <div class="contact-details">
                    <div class="contact-item">
                        <h3>Address</h3>
                        <p>500 Commerce Street<br>City Center, CC 56789</p>
                    </div>
                    <div class="contact-item">
                        <h3>Phone</h3>
                        <p>+1 (800) 555-0199</p>
                    </div>
                    <div class="contact-item">
                        <h3>Email</h3>
                        <p>support@blinkbite.com</p>
                    </div>
                    <div class="contact-item">
                        <h3>Hours</h3>
                        <p>Every day: 7AM - 12AM</p>
                    </div>
                </div>
            </div>
            <div class="contact-form">
                <h2>Send us a Message</h2>
                <form id="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
