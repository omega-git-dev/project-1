<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlinkBite - Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header></header>
    <main>
        <section class="hero menu-hero">
            <div class="hero-copy">
                <span class="eyebrow">Shop by taste</span>
                <h1>Discover millions of dishes, groceries and flavours</h1>
                <p>Search or browse by category to find your next favourite meal.</p>
            </div>
        </section>
        <section class="menu-filters">
            <div class="filter-row">
                <div class="search-bar compact">
                    <input id="menu-search" type="search" placeholder="Search meals, snacks, beverages..." aria-label="Search menu">
                    <button id="menu-search-btn" type="button">Search</button>
                </div>
                <div class="filter-summary">
                    <span id="results-count">Showing 0 items</span>
                </div>
            </div>
            <div id="menu-category-list" class="category-chips"></div>
        </section>
        <section class="menu-layout">
            <aside class="sidebar">
                <div class="sidebar-card flash-deals-card">
                    <h2>Flash Deals</h2>
                    <div id="flash-deals-list" class="flash-deals-list"></div>
                </div>
                <div class="sidebar-card quick-order-card">
                    <h2>Quick Order</h2>
                    <div id="quick-order-list" class="quick-order-list"></div>
                </div>
            </aside>
            <section class="menu-section" id="menu-list">
                <div id="menu-grid" class="menu-grid"></div>
                <div class="load-more-wrap">
                    <button id="load-more-btn" class="load-more-btn">Load more items</button>
                </div>
            </section>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
